name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel jobs for previous commits in the same branch.
# On main `head_ref` is not available and `run_id` is always unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-checks:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c  # v31.10.7

      # `keep-going` reports every failing check in one run, rather than stopping at the first.
      - name: Flake checks
        run: nix flake check --print-build-logs --option keep-going true

  install:
    name: install (${{ matrix.os }}, ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        # `v0.1.0` checks that a leading `v` is accepted.
        version: [latest, 0.1.0, v0.1.0]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: setup
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Check the installed version
        env:
          REQUESTED: ${{ matrix.version }}
          INSTALLED: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail
          test "$(chiplab-cli --version)" = "chiplab-cli $INSTALLED"
          if [ "$REQUESTED" != latest ]; then
            test "$INSTALLED" = "${REQUESTED#v}"
          fi

  # Each case must fail in the action, not later in the job.
  install-fails:
    name: install fails (${{ matrix.os }}, ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            version: latest
          - os: ubuntu-latest
            version: not-a-version

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: setup
        uses: ./
        continue-on-error: true
        with:
          version: ${{ matrix.version }}

      - name: Expect failure
        shell: bash
        env:
          OUTCOME: ${{ steps.setup.outcome }}
        run: test "$OUTCOME" = failure

  # Single status for branch protection to gate on, so the jobs can change without
  # the ruleset needing to know their shape.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - flake-checks
      - install
      - install-fails
    if: always()
    steps:
      - run: exit 1
        if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
